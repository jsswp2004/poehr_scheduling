apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: poehr-migrate-core
  annotations:
    run.googleapis.com/cloudsql-instances: poehr-364520:us-central1:poehr-db-instance
spec:
  template:
    spec:
      template:
        spec:
          containers:
            - name: migrate
              image: gcr.io/poehr-364520/poehr-scheduling
              command:
                - python
              args:
                - manage.py
                - migrate
              env:
                - name: DJANGO_SETTINGS_MODULE
                  value: poehr_scheduling_backend.settings_core
                - name: DB_ENGINE
                  value: django.db.backends.postgresql
                - name: DB_NAME
                  value: poehr_scheduling_db
                - name: DB_USER
                  value: poehr_user
                - name: DB_PASSWORD
                  value: Poehr1357!
                - name: DB_HOST
                  value: "127.0.0.1"
                - name: DB_PORT
                  value: "5432"
              resources:
                limits:
                  cpu: 1000m
                  memory: 512Mi
          maxRetries: 3
          timeoutSeconds: 900
