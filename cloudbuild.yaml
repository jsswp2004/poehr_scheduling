steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-f",
        "Dockerfile.production",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/poehr-scheduling/poehr-scheduling:latest",
        ".",
      ]

  # Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/poehr-scheduling/poehr-scheduling:latest",
      ]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "poehr-scheduling"
      - "--image"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/poehr-scheduling/poehr-scheduling:latest"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--add-cloudsql-instances"
      - "$PROJECT_ID:us-central1:poehr-db-instance"
      - "--set-env-vars"
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,DJANGO_SETTINGS_MODULE=poehr_scheduling_backend.settings_production,DEBUG=False"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--max-instances"
      - "10"
      - "--min-instances"
      - "0"
      - "--port"
      - "8080"
      - "--timeout"
      - "3600"

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/poehr-scheduling/poehr-scheduling:latest"

options:
  logging: CLOUD_LOGGING_ONLY
