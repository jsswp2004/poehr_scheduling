<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Video visit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3fd"/>
      <stop offset="1" stop-color="#bcd9f3"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa3f5"/>
      <stop offset="1" stop-color="#2f86e0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- video window -->
  <rect x="84" y="64" width="432" height="286" rx="34" fill="url(#screen)"/>
  <!-- patient on screen -->
  <circle cx="262" cy="170" r="48" fill="#ffffff"/>
  <path d="M158 322c0-52 46-84 104-84s104 32 104 84v28H158z" fill="#ffffff"/>
  <!-- provider picture-in-picture -->
  <rect x="384" y="214" width="110" height="110" rx="20" fill="#1d6fc4"/>
  <circle cx="439" cy="254" r="20" fill="#cfe5fb"/>
  <path d="M400 316c0-22 17-36 39-36s39 14 39 36z" fill="#cfe5fb"/>
  <!-- connection badge -->
  <circle cx="470" cy="104" r="30" fill="#ffffff"/>
  <path d="M455 105l11 11 21-23" fill="none" stroke="#2f86e0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- call controls -->
  <circle cx="226" cy="394" r="26" fill="#ffffff"/>
  <rect x="219" y="378" width="14" height="22" rx="7" fill="#2f86e0"/>
  <path d="M212 394a14 14 0 0 0 28 0" fill="none" stroke="#2f86e0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="394" r="30" fill="#e5484d"/>
  <path d="M283 398c10-9 24-9 34 0" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <circle cx="374" cy="394" r="26" fill="#ffffff"/>
  <rect x="360" y="385" width="18" height="18" rx="4" fill="#2f86e0"/>
  <path d="M380 391l10-6v18l-10-6z" fill="#2f86e0"/>
</svg>
