# Azure Container App Health Probe Configuration
# Add this to your azure-container-app.yaml or configure in Portal

probes:
  liveness:
    httpGet:
      path: /health/
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    
  readiness:
    httpGet:
      path: /ready/
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
