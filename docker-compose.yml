services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: poehr_db
      POSTGRES_USER: jsswp2004
      POSTGRES_PASSWORD: krat27Miko!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2.4
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    build: .
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8005:8005"
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=poehr_db
      - DB_USER=jsswp2004
      - DB_PASSWORD=krat27Miko!
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/code
      - /code/node_modules
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  redis_data:
  postgres_data:
