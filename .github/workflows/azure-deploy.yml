name: Deploy to Azure Container Apps

on:
  push:
    branches: [docker-azure-deployment, azure-deployment-fixed]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: poehr-scheduling-rg
  AZURE_CONTAINER_APP: poehr-scheduling
  AZURE_CONTAINER_REGISTRY: poehrschedulingacr
  IMAGE_NAME: poehr-scheduling

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker image
        run: |
          docker build --no-cache -f Dockerfile.azure -t poehrschedulingacr.azurecr.io/poehr-scheduling:${{ github.sha }} .
          docker tag poehrschedulingacr.azurecr.io/poehr-scheduling:${{ github.sha }} poehrschedulingacr.azurecr.io/poehr-scheduling:latest

      - name: Login to Azure Container Registry
        run: az acr login --name poehrschedulingacr

      - name: Push image to ACR
        run: |
          docker push poehrschedulingacr.azurecr.io/poehr-scheduling:${{ github.sha }}
          docker push poehrschedulingacr.azurecr.io/poehr-scheduling:latest

      - name: Deploy to Azure Container Apps
        run: |
          echo "Updating container app with new image..."
          az containerapp update \
            --name poehr-scheduling \
            --resource-group poehr-scheduling-rg \
            --image poehrschedulingacr.azurecr.io/poehr-scheduling:${{ github.sha }} \
            --revision-suffix $(date +%s)

          echo "Waiting for deployment to complete..."
          sleep 30

          echo "Getting latest revision name..."
          LATEST_REVISION=$(az containerapp revision list \
            --name poehr-scheduling \
            --resource-group poehr-scheduling-rg \
            --query "[0].name" \
            --output tsv)

          echo "Latest revision: $LATEST_REVISION"

      - name: Verify deployment
        run: |
          az containerapp show \
            --name poehr-scheduling \
            --resource-group poehr-scheduling-rg \
            --query properties.configuration.ingress.fqdn \
            --output tsv
