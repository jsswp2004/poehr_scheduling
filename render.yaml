# Render Blueprint for the POEHR Scheduling showcase backend.
# In Render: New -> Blueprint -> select this repo -> it reads this file.
services:
  - type: web
    name: poehr-scheduling-api
    runtime: python
    plan: free
    region: ohio
    branch: azure-deployment-fixed
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py seed_demo_data
    startCommand: "gunicorn poehr_scheduling_backend.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: poehr_scheduling_backend.settings_render
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CORS_ORIGINS
        value: "https://www.powerhealthcareit.com,https://powerhealthcareit.com,https://poehr-scheduling.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: poehr-scheduling-db
          property: connectionString
      # Outbound email now goes through Resend's HTTPS API (see EMAIL_BACKEND
      # in settings.py) instead of raw SMTP, because Render blocks outbound
      # SMTP ports on web services entirely -- no combination of
      # EMAIL_HOST_USER/EMAIL_HOST_PASSWORD could ever have worked here.
      # sync: false means Render won't read a value from this file for this
      # key -- it just marks it required and prompts for it once in the
      # dashboard (Environment tab), where it's stored encrypted.
      - key: RESEND_API_KEY
        sync: false
      # EMAIL_HOST_USER / EMAIL_HOST_PASSWORD are no longer used (kept set
      # in the Render dashboard already, but safe to remove whenever) --
      # left out of this file now that nothing reads them.
      #
      # Twilio SMS (communicator/utils.py send_sms, users/views.py send_sms).
      # Unlike SMTP, Twilio's SDK calls api.twilio.com over plain HTTPS, which
      # Render does NOT block -- these just need to actually be set. sync:
      # false again means Render won't read a value from this file; set it
      # in the dashboard's Environment tab instead.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

databases:
  - name: poehr-scheduling-db
    plan: free
    region: ohio
