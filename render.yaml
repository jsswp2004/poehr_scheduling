# Render Blueprint for the POEHR Scheduling showcase backend.
# In Render: New -> Blueprint -> select this repo -> it reads this file.
services:
  - type: web
    name: poehr-scheduling-api
    runtime: python
    plan: free
    region: ohio
    branch: azure-deployment-fixed
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: "gunicorn poehr_scheduling_backend.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: poehr_scheduling_backend.settings_render
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CORS_ORIGINS
        value: "https://www.powerhealthcareit.com,https://powerhealthcareit.com"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: poehr-scheduling-db
          property: connectionString

databases:
  - name: poehr-scheduling-db
    plan: free
    region: ohio
