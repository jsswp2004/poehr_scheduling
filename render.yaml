# Render Blueprint for the POEHR Scheduling showcase backend.
# In Render: New -> Blueprint -> select this repo -> it reads this file.
services:
  - type: web
    name: poehr-scheduling-api
    runtime: python
    plan: free
    region: ohio
    branch: azure-deployment-fixed
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py seed_demo_data
    startCommand: "gunicorn poehr_scheduling_backend.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: poehr_scheduling_backend.settings_render
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CORS_ORIGINS
        value: "https://www.powerhealthcareit.com,https://powerhealthcareit.com,https://poehr-scheduling.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: poehr-scheduling-db
          property: connectionString
      # SMTP credentials for the info@powerhealthcareit.com mailbox
      # (mail.privateemail.com, see EMAIL_HOST in settings.py). sync: false
      # means Render will NOT read a value from this file for these -- it
      # just marks them as required and prompts for them once in the
      # dashboard (Environment tab), where they're stored encrypted. That
      # keeps the actual password out of git entirely.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: poehr-scheduling-db
    plan: free
    region: ohio
